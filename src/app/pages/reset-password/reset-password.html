<div class="rp-page">
  <div class="rp-card">

    <div class="rp-logo">
      <i class="bi bi-buildings-fill"></i>
      <span>CitySparsh</span>
    </div>

    <!-- Success -->
    <div class="rp-success" *ngIf="success">
      <div class="rp-success-icon"><i class="bi bi-check-circle-fill"></i></div>
      <h2 class="rp-success-title">Password reset!</h2>
      <p class="rp-success-sub">Redirecting you to login…</p>
    </div>

    <!-- Error — bad token -->
    <div class="rp-error-state" *ngIf="error && !success && !token">
      <i class="bi bi-exclamation-triangle-fill rp-error-icon"></i>
      <h2 class="rp-error-title">Invalid link</h2>
      <p class="rp-error-sub">{{ error }}</p>
      <a routerLink="/login" class="rp-btn">Back to login</a>
    </div>

    <!-- Form -->
    <ng-container *ngIf="token && !success">
      <h2 class="rp-title">Set new password</h2>
      <p class="rp-sub">Choose a strong password for your CitySparsh account.</p>

      <!-- Error banner -->
      <div class="rp-error-banner" *ngIf="error">
        <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
      </div>

      <!-- New password -->
      <div class="rp-field">
        <label class="rp-label">New Password</label>
        <div class="rp-input-wrap">
          <i class="bi bi-lock rp-icon"></i>
          <input class="rp-input" [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="newPassword" name="newPassword"
                 placeholder="Min. 6 characters">
          <button type="button" class="rp-eye" (click)="showPassword = !showPassword">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
      </div>

      <!-- Confirm password -->
      <div class="rp-field">
        <label class="rp-label">Confirm Password</label>
        <div class="rp-input-wrap" [class.rp-input-wrap--err]="passwordMismatch">
          <i class="bi bi-lock rp-icon"></i>
          <input class="rp-input" [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="confirmPassword" name="confirmPassword"
                 placeholder="Repeat password">
        </div>
        <span class="rp-err" *ngIf="passwordMismatch">Passwords do not match</span>
      </div>

      <button class="rp-btn" (click)="submit()" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
        <ng-container *ngIf="!loading"><i class="bi bi-shield-check"></i> Reset Password</ng-container>
        <ng-container *ngIf="loading">Resetting…</ng-container>
      </button>

      <a routerLink="/login" class="rp-back">← Back to login</a>
    </ng-container>

  </div>
</div>
